<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Trail Search — Salesforce Debug Tool</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕐</text></svg>">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa',
                            500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a',
                        },
                        salesforce: '#00a1e0'
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body
    class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col">

    <nav class="flex-none bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/deploytool"
                    class="text-sm text-gray-500 dark:text-gray-400 hover:text-primary-600 dark:hover:text-primary-400 transition-colors">←
                    Salesforce Deployer Pro</a>
                <span class="text-gray-300 dark:text-gray-600">/</span>
                <span class="font-semibold text-sm">🕐 Audit Trail Search</span>
            </div>
            <button id="themeToggleBtn"
                class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors focus:outline-none">
                <svg id="themeToggleLightIcon" class="hidden w-5 h-5" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                    </path>
                </svg>
                <svg id="themeToggleDarkIcon" class="hidden w-5 h-5" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                    </path>
                </svg>
            </button>
        </div>
    </nav>

    <main class="flex-1 w-full">

        <!-- Login Screen -->
        <div id="loginScreen" class="max-w-md mx-auto px-4 py-16">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold mb-2">Audit Trail Search</h1>
                <p class="text-gray-500 dark:text-gray-400 text-sm">Connect to a Salesforce org to search its full
                    Setup Audit Trail.</p>
            </div>
            <div
                class="bg-blue-50/50 dark:bg-blue-900/10 border border-blue-100 dark:border-blue-900/40 rounded-lg p-4 space-y-3 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                <h4 class="text-sm font-medium text-blue-900 dark:text-blue-300 ml-1">Connect Org</h4>

                <div id="loginButtons">
                    <p class="text-xs text-gray-500 dark:text-gray-400 mb-2">Connect via Salesforce OAuth:</p>
                    <div class="flex gap-2">
                        <button onclick="loginOrg('production')"
                            class="flex-1 px-3 py-1.5 text-xs font-medium rounded-md bg-blue-600 hover:bg-blue-700 text-white transition-colors">Production</button>
                        <button onclick="loginOrg('sandbox')"
                            class="flex-1 px-3 py-1.5 text-xs font-medium rounded-md bg-blue-100 hover:bg-blue-200 dark:bg-blue-900/40 dark:hover:bg-blue-900/70 text-blue-800 dark:text-blue-300 transition-colors">Sandbox</button>
                    </div>
                </div>

                <!-- Manual entry fallback -->
                <details>
                    <summary
                        class="text-xs text-gray-400 dark:text-gray-500 cursor-pointer hover:text-gray-600 dark:hover:text-gray-300 select-none">
                        Manual entry</summary>
                    <div class="mt-2 space-y-2">
                        <input type="text" id="manualInstance" placeholder="Instance URL (https://na139...)"
                            class="w-full bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-md px-3 py-1.5 text-xs focus:ring-1 focus:ring-blue-500 outline-none transition-all dark:placeholder-gray-500">
                        <input type="password" id="manualSession" placeholder="Session ID / Access Token"
                            class="w-full bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-md px-3 py-1.5 text-xs font-mono focus:ring-1 focus:ring-blue-500 outline-none transition-all dark:placeholder-gray-500">
                        <button onclick="connectManual()"
                            class="w-full px-3 py-1.5 text-xs font-medium rounded-md bg-gray-700 hover:bg-gray-800 text-white transition-colors">Connect</button>
                    </div>
                </details>
            </div>
        </div>

        <!-- Search Screen -->
        <div id="searchScreen" class="hidden max-w-6xl mx-auto px-4 py-6 space-y-4">

            <!-- Connected bar -->
            <div
                class="flex items-center justify-between bg-blue-100 dark:bg-blue-900/40 rounded-lg px-4 py-2.5">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-green-500"></div>
                    <span id="connectedLabel" class="text-xs font-medium text-blue-900 dark:text-blue-200"></span>
                    <span id="lastLoadedWrap" class="text-xs text-blue-500 dark:text-blue-400">· last loaded
                        <span id="lastLoaded">—</span></span>
                </div>
                <div class="flex items-center gap-3">
                    <button id="refreshBtn" onclick="loadAuditTrail()"
                        class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-md bg-blue-600 hover:bg-blue-700 text-white transition-colors disabled:opacity-50">
                        <svg id="refreshSpinner" class="hidden animate-spin h-3.5 w-3.5" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"
                                fill="none"></circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                            </path>
                        </svg>
                        Refresh
                    </button>
                    <button onclick="disconnectOrg()"
                        class="text-xs text-blue-500 hover:text-red-500 dark:text-blue-400 dark:hover:text-red-400 transition-colors">Disconnect</button>
                </div>
            </div>

            <div id="errorBox"
                class="hidden bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-900/40 text-red-700 dark:text-red-400 text-xs rounded-lg px-4 py-2.5">
            </div>

            <!-- Filters -->
            <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
                    <div>
                        <label class="block text-[11px] font-medium text-gray-500 dark:text-gray-400 mb-1">From</label>
                        <input type="datetime-local" id="dateFrom"
                            class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-md px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-gray-500 dark:text-gray-400 mb-1">To</label>
                        <input type="datetime-local" id="dateTo"
                            class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-md px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-gray-500 dark:text-gray-400 mb-1">User</label>
                        <input type="text" id="userFilter" placeholder="e.g. Jane Doe"
                            class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-md px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-blue-500 outline-none dark:placeholder-gray-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-gray-500 dark:text-gray-400 mb-1">Section</label>
                        <select id="sectionFilter"
                            class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-md px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-blue-500 outline-none">
                            <option value="">All Sections</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-gray-500 dark:text-gray-400 mb-1">Search
                            (component / change)</label>
                        <input type="text" id="textFilter" placeholder="e.g. My_Flow, Profile, Field..."
                            class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-md px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-blue-500 outline-none dark:placeholder-gray-500">
                    </div>
                </div>
                <div class="flex justify-end mt-3">
                    <button onclick="clearFilters()"
                        class="text-xs text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors">Clear
                        filters</button>
                </div>
            </div>

            <!-- Results -->
            <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl overflow-hidden">
                <div class="px-4 py-2.5 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                    <span class="text-xs text-gray-500 dark:text-gray-400"><span id="resultCountBadge">0</span> of
                        <span id="totalBadge">0</span> entries</span>
                    <div class="flex items-center gap-2 text-xs">
                        <button id="prevPageBtn" onclick="changePage(-1)"
                            class="px-2 py-1 rounded border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-40 disabled:cursor-not-allowed">Prev</button>
                        <span id="pageInfo" class="text-gray-400">Page 1 of 1</span>
                        <button id="nextPageBtn" onclick="changePage(1)"
                            class="px-2 py-1 rounded border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-40 disabled:cursor-not-allowed">Next</button>
                    </div>
                </div>
                <div class="overflow-x-auto max-h-[60vh] overflow-y-auto">
                    <table class="min-w-full">
                        <thead class="bg-gray-50 dark:bg-gray-900/50 sticky top-0">
                            <tr>
                                <th data-sort-field="CreatedDate" onclick="setSort('CreatedDate')"
                                    class="px-4 py-2 text-left text-[11px] font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider cursor-pointer select-none whitespace-nowrap">
                                    Date/Time <span class="sort-indicator"></span></th>
                                <th data-sort-field="User" onclick="setSort('User')"
                                    class="px-4 py-2 text-left text-[11px] font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider cursor-pointer select-none whitespace-nowrap">
                                    User <span class="sort-indicator"></span></th>
                                <th data-sort-field="Section" onclick="setSort('Section')"
                                    class="px-4 py-2 text-left text-[11px] font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider cursor-pointer select-none whitespace-nowrap">
                                    Section <span class="sort-indicator"></span></th>
                                <th data-sort-field="Action" onclick="setSort('Action')"
                                    class="px-4 py-2 text-left text-[11px] font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider cursor-pointer select-none whitespace-nowrap">
                                    Action <span class="sort-indicator"></span></th>
                                <th data-sort-field="Display" onclick="setSort('Display')"
                                    class="px-4 py-2 text-left text-[11px] font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider cursor-pointer select-none">
                                    Change <span class="sort-indicator"></span></th>
                            </tr>
                        </thead>
                        <tbody id="resultsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <script src="/static/audit-trail-search.js"></script>
    <script>
        // Same dark-mode convention as the main app (shared 'color-theme' key).
        const themeToggleDarkIcon = document.getElementById('themeToggleDarkIcon');
        const themeToggleLightIcon = document.getElementById('themeToggleLightIcon');
        const themeToggleBtn = document.getElementById('themeToggleBtn');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function () {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('color-theme', isDark ? 'dark' : 'light');
        });
    </script>
</body>

</html>
