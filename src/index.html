<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Salesforce Debug Tool</title>
  <meta name="description" content="Free, browser-based toolkit for Salesforce debug logs, metadata deploys, audit trail search, and access exploration. Client-side and stateless — no credentials stored.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="https://npmcdn.com/angular2-toaster@3.0.1/toaster.css" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Salesforce Debug Tool",
    "url": "https://salesforce-debugtool.herokuapp.com/",
    "description": "Free, browser-based toolkit for Salesforce admins and developers: search, download, and manage debug logs and trace flags, deploy metadata between orgs, search the setup audit trail, and see what a user can access and why. Runs entirely client-side in your browser and is stateless — no installation, no credentials stored on any server.",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Any",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>

</head>
<body class="mat-typography">
  
  <app-root></app-root>
  <script src="/static/contact-widget.js" defer></script>
</body>
</html>
